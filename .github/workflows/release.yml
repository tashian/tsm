name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write       # gh release create
  id-token: write       # OIDC for npm Trusted Publishing + sigstore provenance
  attestations: write   # actions/attest-build-provenance

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - uses: actions/setup-node@v6
        with:
          # Node 24 ships npm 11.x, which has the Trusted Publishing OIDC
          # handshake. Node 22's bundled npm 10.x silently publishes
          # unauthenticated and fails as 404.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: extractions/setup-just@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build & package binaries
        run: just package ${{ steps.ver.outputs.version }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/bin/tsm
            dist/bin/tsmd
            dist/release/tsm_${{ steps.ver.outputs.version }}_darwin_arm64.tar.gz

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v${{ steps.ver.outputs.version }} \
            dist/release/tsm_${{ steps.ver.outputs.version }}_darwin_arm64.tar.gz \
            dist/release/checksums.txt \
            --title "v${{ steps.ver.outputs.version }}" \
            --generate-notes

      - name: Stage npm platform package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          mkdir -p npm/darwin-arm64/bin
          cp dist/bin/tsm dist/bin/tsmd npm/darwin-arm64/bin/
          chmod +x npm/darwin-arm64/bin/tsm npm/darwin-arm64/bin/tsmd
          cp LICENSE npm/darwin-arm64/LICENSE
          cp LICENSE npm/wrapper/LICENSE
          jq --arg v "$VERSION" '.version = $v' \
            npm/darwin-arm64/package.json > npm/darwin-arm64/package.json.tmp
          mv npm/darwin-arm64/package.json.tmp npm/darwin-arm64/package.json
          jq --arg v "$VERSION" \
            '.version = $v | .optionalDependencies["@tashian/tsm-darwin-arm64"] = $v' \
            npm/wrapper/package.json > npm/wrapper/package.json.tmp
          mv npm/wrapper/package.json.tmp npm/wrapper/package.json

      # Publish order matters: platform first so the wrapper's
      # optionalDependencies resolve when the wrapper hits the registry.
      - name: Publish @tashian/tsm-darwin-arm64
        working-directory: npm/darwin-arm64
        run: npm publish --provenance --access public

      - name: Publish @tashian/tsm
        working-directory: npm/wrapper
        run: npm publish --provenance --access public

      # The Claude Code plugin is installed straight from this git repo, not
      # from a registry, and `claude plugin update` only refreshes when the
      # manifest version changes. So unlike the npm bumps above (which live
      # only in the runner's working tree), this one has to be committed to
      # main. Runs last so a failed publish doesn't leave a bump pointing at
      # a release that doesn't exist. Pushes made with GITHUB_TOKEN don't
      # trigger other workflows, so this can't loop.
      - name: Bump plugin version on main
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          jq --arg v "$VERSION" '.version = $v' \
            plugin/.claude-plugin/plugin.json > plugin/.claude-plugin/plugin.json.tmp
          mv plugin/.claude-plugin/plugin.json.tmp plugin/.claude-plugin/plugin.json
          jq --arg v "$VERSION" '(.plugins[] | select(.name == "tsm") | .version) = $v' \
            .claude-plugin/marketplace.json > .claude-plugin/marketplace.json.tmp
          mv .claude-plugin/marketplace.json.tmp .claude-plugin/marketplace.json
          if git diff --quiet; then
            echo "plugin already at $VERSION; nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/.claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "chore(plugin): bump plugin version to $VERSION"
          git push origin main
